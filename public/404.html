<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>基本情報技術者 Trainer</title>
    <script>
      // GitHub Pagesは静的ホスティングのため、SPA内のパス（例: /practice）へ直接アクセス・
      // リロードすると404になる。ここでパスをクエリ文字列にエンコードしてアプリのルートへ
      // リダイレクトし、index.html側のスクリプトでURLを復元する（spa-github-pages方式）。
      var pathSegmentsToKeep = 1; // リポジトリ名 (/shijimiworks-FETrainaer/) の1階層分を保持
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
